<!DOCTYPE html>
<html lang="ru" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{ subject }}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <style type="text/css">
        body, table, td, a { font-family: Arial, Helvetica, sans-serif !important; }
    </style>
    <![endif]-->
    <style>
        :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
        }
        body {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        /* Базовые стили контента */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            color: #FFFFFF;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #A0A09A;
        }
        .details {
            background-color: #1D1D1B;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #282824;
        }
        .detail-row {
            display: block;
            margin-bottom: 12px;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            display: block;
            font-size: 12px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .detail-value {
            display: block;
            font-size: 16px;
            color: #FFFFFF;
            font-weight: 500;
        }
        .accent {
            color: #00FFA3 !important;
        }
        .button {
            display: inline-block;
            background-color: #00FFA3;
            color: #0D0D0B !important;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 16px;
        }
        ul {
            margin: 0 0 24px 0;
            padding: 0 0 0 20px;
            color: #A0A09A;
        }
        li {
            margin-bottom: 12px;
            line-height: 1.6;
        }
        a {
            color: #00FFA3;
            text-decoration: underline;
        }

        @media (prefers-color-scheme: dark) {
            body, .wrapper {
                background-color: #0D0D0B !important;
                color: #FFFFFF !important;
            }
            .content-card {
                background-color: #141412 !important;
                border-color: #282824 !important;
            }
            .details {
                background-color: #1D1D1B !important;
                border-color: #282824 !important;
            }
            .footer-text {
                color: #888888 !important;
            }
            p {
                color: #A0A09A !important;
            }
        }
        /* Улучшения для мобильных клиентов */
        @media only screen and (max-width: 600px) {
            .content-cell {
                padding: 24px !important;
            }
            .details {
                padding: 16px !important;
            }
        }
        /* Фиксы для Outlook/Gmail Dark Mode */
        [data-ogsc] body, [data-ogsc] .wrapper {
            background-color: #0D0D0B !important;
            color: #FFFFFF !important;
        }
        [data-ogsc] .details {
            background-color: #1D1D1B !important;
        }
        [data-ogsb] .content-card {
            background-color: #141412 !important;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0D0D0B; color: #FFFFFF; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
    <div class="wrapper" role="article" aria-roledescription="email" lang="ru" style="background-color: #0D0D0B; width: 100%;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0D0D0B;">
            <tr>
                <td align="center" style="padding: 40px 10px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                        <!-- Logo Section -->
                        <tr>
                            <td align="center" style="padding-bottom: 40px;">
                                <div style="font-size: 28px; font-weight: 800; letter-spacing: 4px; color: #FFFFFF; text-transform: uppercase;">
                                    NEXUS
                                </div>
                                <div style="font-size: 10px; color: #00FFA3; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; font-weight: 500;">
                                    Digital Banking
                                </div>
                            </td>
                        </tr>
                        <!-- Main Content Card -->
                        <tr>
                            <td class="content-card content-cell" style="background-color: #141412; padding: 40px; border-radius: 24px; border: 1px solid #282824;">
                                {% block content %}{% endblock %}
                            </td>
                        </tr>
                        <!-- Footer -->
                        <tr>
                            <td class="footer-text" align="center" style="padding-top: 40px; color: #666666; font-size: 12px; line-height: 1.5;">
                                &copy; 2026 NEXUS Digital Bank. Все права защищены.<br>
                                Это автоматическое уведомление службы безопасности.<br>
                                Не отвечайте на это письмо.
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
