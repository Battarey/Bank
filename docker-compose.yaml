services:

##########  API Gateway  ##########

  gateway_service:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    env_file: ./gateway_service/.env
    restart: unless-stopped
    depends_on:
      - auth_service
      - customer_service
      - account_service
      - currency_service
      - metal_service
      - transaction_service
      - redis_sessions
      - redis_onboarding
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
      - data


##########  Бизнес-сервисы  ##########

  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    env_file: ./auth_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis_sessions:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - data

  customer_service:
    build:
      context: .
      dockerfile: ./customer_service/Dockerfile
    env_file: ./customer_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis_onboarding:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - data

  account_service:
    build:
      context: .
      dockerfile: ./account_service/Dockerfile
    env_file: ./account_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - data

  currency_service:
    build:
      context: .
      dockerfile: ./currency_service/Dockerfile
    env_file: ./currency_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - data

  log_service:
    build:
      context: .
      dockerfile: ./log_service/Dockerfile
    env_file: ./log_service/.env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres_history:
        condition: service_healthy
    networks:
      - backend
      - data

  metal_service:
    build:
      context: .
      dockerfile: ./metal_service/Dockerfile
    env_file: ./metal_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - backend
      - data

  notification_service:
    build:
      context: .
      dockerfile: ./notification_service/Dockerfile
    env_file: ./notification_service/.env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data

  transaction_service:
    build:
      context: .
      dockerfile: ./transaction_service/Dockerfile
    env_file: ./transaction_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      security_service:
        condition: service_started
    networks:
      - backend
      - data

  security_service:
    build:
      context: .
      dockerfile: ./security_service/Dockerfile
    env_file: ./security_service/.env
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - backend
      - data


##########  Миграции  ##########

  migrations:
    build: ./migrations
    env_file: ./migrations/.env
    command: ["python", "reset_and_upgrade.py"]
    depends_on:
      postgres_core:
        condition: service_healthy
    restart: "no"
    networks:
      - data


##########  Инфраструктура (БД, брокер, кэш)  ##########

  postgres_core:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB}
      POSTGRES_USER: ${POSTGRES_CORE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CORE_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - pg_core_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_CORE_HOST_PORT}:${POSTGRES_CORE_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CORE_USER} -d ${POSTGRES_CORE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  postgres_history:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_HISTORY_DB}
      POSTGRES_USER: ${POSTGRES_HISTORY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HISTORY_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - pg_history_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HISTORY_HOST_PORT}:${POSTGRES_HISTORY_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_HISTORY_USER} -d ${POSTGRES_HISTORY_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${RABBITMQ_HOST_PORT}:${RABBITMQ_CONTAINER_PORT}"
      - "${RABBITMQ_WEB_HOST_PORT}:${RABBITMQ_WEB_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis_sessions:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    env_file:
      - ./.env
    ports:
      - "${REDIS_SESSIONS_HOST_PORT}:${REDIS_SESSIONS_CONTAINER_PORT}"
    volumes:
      - redis_sessions_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis_onboarding:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${REDIS_ONBOARDING_HOST_PORT}:${REDIS_ONBOARDING_CONTAINER_PORT}"
    volumes:
      - redis_onboarding_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_HOST_PORT}:${MONGO_CONTAINER_PORT}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - ch_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HOST_PORT}:${CLICKHOUSE_CONTAINER_PORT}"
      - "${CLICKHOUSE_TCP_HOST_PORT}:${CLICKHOUSE_TCP_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres_core:
        condition: service_healthy
      postgres_history:
        condition: service_healthy
    networks:
      - data

  mongo_express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_HOST_PORT}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - data


##########  Сети  ##########

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge


##########  Тома  ##########

volumes:
  pg_core_data:
  pg_history_data:
  redis_sessions_data:
  redis_onboarding_data:
  mongo_data:
  ch_data:
  pgadmin_data:
