services:
  customer_service_test:
    build:
      context: .
      dockerfile: ./customer_service/Dockerfile
    volumes:
      - ./customer_service:/app/customer_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r customer_service/requirements-test.txt &&
               pytest --cov=customer_service customer_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  account_service_test:
    build:
      context: .
      dockerfile: ./account_service/Dockerfile
    volumes:
      - ./account_service:/app/account_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r account_service/requirements-test.txt &&
               pytest --cov=account_service account_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - test_network

  auth_service_test:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    volumes:
      - ./auth_service:/app/auth_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r auth_service/requirements-test.txt > /dev/null &&
               pytest --cov=auth_service auth_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - test_network

  security_service_test:
    build:
      context: .
      dockerfile: ./security_service/Dockerfile
    volumes:
      - ./security_service:/app/security_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r security_service/requirements-test.txt > /dev/null &&
               pytest --cov=security_service security_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  transaction_service_test:
    build:
      context: .
      dockerfile: ./transaction_service/Dockerfile
    volumes:
      - ./transaction_service:/app/transaction_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r transaction_service/requirements-test.txt > /dev/null &&
               pytest --cov=transaction_service transaction_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  notification_service_test:
    build:
      context: .
      dockerfile: ./notification_service/Dockerfile
    volumes:
      - ./notification_service:/app/notification_service
    command: >
      bash -c "pip install --no-cache-dir -r notification_service/requirements-test.txt > /dev/null &&
               pytest --cov=notification_service notification_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - SMTP_HOST=smtp.example.com
      - SMTP_USER=test@example.com
    networks:
      - test_network

  metal_service_test:
    build:
      context: .
      dockerfile: ./metal_service/Dockerfile
    volumes:
      - ./metal_service:/app/metal_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r metal_service/requirements-test.txt > /dev/null &&
               pytest --cov=metal_service metal_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  currency_service_test:
    build:
      context: .
      dockerfile: ./currency_service/Dockerfile
    volumes:
      - ./currency_service:/app/currency_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r currency_service/requirements-test.txt > /dev/null &&
               pytest --cov=currency_service currency_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  log_service_test:
    build:
      context: .
      dockerfile: ./log_service/Dockerfile
    volumes:
      - ./log_service:/app/log_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r log_service/requirements-test.txt > /dev/null &&
               pytest --cov=log_service log_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  gateway_service_test:
    image: golang:1.23-alpine
    volumes:
      - ./gateway_service:/app
    working_dir: /app
    command: >
      sh -c "go get github.com/stretchr/testify && go test -v -mod=mod -coverpkg=./... -coverprofile=coverage.out ./... && go tool cover -func=coverage.out"
    environment:
      - REDIS_SESSIONS_URL=redis://redis_test:6379/0
      - REDIS_ONBOARDING_URL=redis://redis_test:6379/1
    networks:
      - test_network
    depends_on:
      - redis_test

  redis_test:
    image: redis/redis-stack-server:latest
    networks:
      - test_network

  account_service_integration_test:
    build:
      context: .
      dockerfile: ./account_service/Dockerfile
    volumes:
      - ./account_service:/app/account_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r account_service/requirements-test.txt &&
               pytest account_service/tests/integration/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgresql+asyncpg://test_user:test_password@postgres_test:5432/test_db
      - INTERNAL_API_KEY=test-internal-key
      - ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - BLIND_INDEX_SALT=test_salt
    networks:
      - test_network
    depends_on:
      postgres_test:
        condition: service_healthy
  customer_service_integration_test:
    build:
      context: .
      dockerfile: ./customer_service/Dockerfile
    volumes:
      - ./customer_service:/app/customer_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r customer_service/requirements-test.txt &&
               pytest customer_service/tests/integration/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgresql+asyncpg://test_user:test_password@postgres_test:5432/test_db
      - REDIS_ONBOARDING_URL=redis://redis_test:6379/1
      - REDIS_SESSIONS_URL=redis://redis_test:6379/0
      - INTERNAL_API_KEY=test-internal-key
      - ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - BLIND_INDEX_SALT=test_salt
    networks:
      - test_network
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_started

  auth_service_integration_test:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    volumes:
      - ./auth_service:/app/auth_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r auth_service/requirements-test.txt &&
               pytest auth_service/tests/integration/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgresql+asyncpg://test_user:test_password@postgres_test:5432/test_db
      - REDIS_SESSIONS_URL=redis://redis_test:6379/0
      - INTERNAL_API_KEY=test-internal-key
      - ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - BLIND_INDEX_SALT=test_salt
    networks:
      - test_network
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_started

  postgres_test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_db
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb_test:
    image: mongo:6.0
    networks:
      - test_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  security_service_integration_test:
    build:
      context: .
      dockerfile: ./security_service/Dockerfile
    volumes:
      - ./security_service:/app/security_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r security_service/requirements-test.txt &&
               pytest security_service/tests/integration/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgresql+asyncpg://test_user:test_password@postgres_test:5432/test_db
      - MONGO_URL=mongodb://mongodb_test:27017/test_security_db
      - INTERNAL_API_KEY=test-internal-key
      - ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - BLIND_INDEX_SALT=test_salt
    networks:
      - test_network
    depends_on:
      postgres_test:
        condition: service_healthy
      mongodb_test:
        condition: service_healthy

networks:
  test_network:
    driver: bridge
