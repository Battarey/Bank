               pytest --cov=security_service security_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  transaction_service_test:
    build:
      context: .
      dockerfile: ./transaction_service/Dockerfile
    volumes:
      - ./transaction_service:/app/transaction_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r transaction_service/requirements-test.txt > /dev/null &&
               pytest --cov=transaction_service transaction_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
    networks:
      - test_network

  notification_service_test:
    build:
      context: .
      dockerfile: ./notification_service/Dockerfile
    volumes:
      - ./notification_service:/app/notification_service
    command: >
      bash -c "pip install --no-cache-dir -r notification_service/requirements-test.txt > /dev/null &&
               pytest --cov=notification_service notification_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
      - RUNNING_IN_DOCKER=true
      - SMTP_HOST=smtp.example.com
      - SMTP_USER=test@example.com
    networks:
      - test_network

  metal_service_test:
    build:
      context: .
      dockerfile: ./metal_service/Dockerfile
    volumes:
      - ./metal_service:/app/metal_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r metal_service/requirements-test.txt > /dev/null &&
               pytest --cov=metal_service metal_service/tests/unit/ -v"
