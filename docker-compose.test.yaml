    volumes:
      - ./currency_service:/app/currency_service
      - ./shared:/app/shared
    command: >
      bash -c "pip install --no-cache-dir -r currency_service/requirements-test.txt > /dev/null &&
               pytest --cov=currency_service currency_service/tests/unit/ -v"
    environment:
      - PYTHONPATH=/app
